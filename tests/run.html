<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Act Quest — Test Suite</title>
    <style>
      body {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        background: #1a1a24;
        color: #e4e4ee;
        padding: 24px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.1rem;
      }
      .line {
        white-space: pre-wrap;
      }
      .pass {
        color: #5fd68a;
      }
      .fail {
        color: #ff6b6b;
      }
      #summary {
        font-weight: bold;
        margin-top: 16px;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Act Quest — Test Suite</h1>
    <div id="out">Running...</div>
    <div id="summary"></div>
    <script type="module">
      // No build step / no Node in this project's toolchain, so this suite
      // runs directly against the real ES modules in a browser tab — same
      // environment the app itself runs in. Serve with the project's normal
      // dev server (e.g. `python3 -m http.server`) and open /tests/run.html.

      // Never let a stale save in this origin's localStorage leak into
      // tests — every GameState instance created in a test must start from
      // a clean default save. Some tests exercise methods that call
      // gameState.save() (streak/achievements/SRS/pacing/study-plan), so
      // stash whatever was really there first and put it back once the
      // suite finishes — otherwise running tests in the same browser
      // profile you actually play in would leave your real save
      // overwritten with the last such test's throwaway state.
      const SAVE_KEY = "act-quest-save-v1";
      const realSave = localStorage.getItem(SAVE_KEY);
      localStorage.removeItem(SAVE_KEY);

      const { getResults } = await import("./assert.js");
      await import("./leveling.test.js");
      await import("./evolution.test.js");
      await import("./boss.test.js");
      await import("./monster-bbox.test.js");
      await import("./questionData.test.js");
      await import("./practiceTestScoring.test.js");
      await import("./practiceTestSections.test.js");
      await import("./adaptiveEngine.test.js");
      await import("./questionPatterns.test.js");
      await import("./srs.test.js");
      await import("./progressFeatures.test.js");
      await import("./diagnostic.test.js");
      await import("./essay.test.js");
      await import("./essayScoring.test.js");
      await import("./mistakeJournal.test.js");
      await import("./scoreReport.test.js");
      await import("./accessibility.test.js");
      await import("./xssSweep.test.js");

      const results = await getResults();

      // Restore (or leave absent, if there wasn't one) whatever real save
      // existed before this run, now that every test has finished writing
      // its own throwaway state to the same localStorage key.
      if (realSave === null) localStorage.removeItem(SAVE_KEY);
      else localStorage.setItem(SAVE_KEY, realSave);

      const out = document.getElementById("out");
      out.innerHTML = results
        .map((r) =>
          r.pass
            ? `<div class="line pass">✅ ${r.name}</div>`
            : `<div class="line fail">❌ ${r.name}\n   ${r.error}</div>`
        )
        .join("");

      const passCount = results.filter((r) => r.pass).length;
      const summary = document.getElementById("summary");
      const allPass = passCount === results.length;
      summary.textContent = `${passCount}/${results.length} passed`;
      summary.className = allPass ? "pass" : "fail";
      document.title = `${allPass ? "✅" : "❌"} ${passCount}/${results.length} — Act Quest Tests`;
    </script>
  </body>
</html>
